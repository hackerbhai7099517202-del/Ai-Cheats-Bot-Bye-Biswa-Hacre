<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cheats Bot - Created by [Aapka Naam]</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 650px; background: #111827; padding: 30px; border-radius: 16px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.15); border: 1px solid #1f2937; position: relative; overflow: hidden; }
        
        /* Premium Creator Badge */
        .creator-badge { position: absolute; top: 15px; right: 15px; background: linear-gradient(45deg, #0284c7, #38bdf8); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.4); }
        
        h1 { text-align: center; margin-top: 15px; margin-bottom: 5px; color: #38bdf8; font-size: 32px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 25px; font-size: 14px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 14px; font-weight: bold; }
        textarea { width: 100%; padding: 14px; background: #070a13; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: all 0.3s; height: 120px; resize: none; }
        textarea:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        
        /* Glowing Button */
        button { width: 100%; padding: 14px; background: linear-gradient(45deg, #0284c7, #06b6d4); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6); }
        button:active { transform: translateY(0); }
        button:disabled { background: #475569; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .output-box { margin-top: 25px; padding: 20px; background: #070a13; border-left: 4px solid #38bdf8; border-radius: 8px; display: none; line-height: 1.6; border: 1px solid #1f2937; border-left: 4px solid #38bdf8; }
        .output-title { font-weight: bold; color: #38bdf8; margin-bottom: 12px; font-size: 16px; }
        .cheat-content { white-space: pre-wrap; font-size: 15px; color: #cbd5e1; }
        
        /* Footer Credit */
        .footer-credit { text-align: center; margin-top: 25px; font-size: 13px; color: #64748b; border-top: 1px solid #1f2937; padding-top: 15px; }
        .footer-credit strong { color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <div class="creator-badge">Owner: [Aapka Naam]</div>

    <h1>🤖 AI Cheats Bot</h1>
    <p class="subtitle">Apna topic likhein aur instant point-wise cheats paayein!</p>
    
    <div class="input-group">
        <label for="topicInput">Aapko kis cheez ka Cheat/Shortcut chahiye?</label>
        <textarea id="topicInput" placeholder="e.g., Python Basics, Excel Formulas, Keyboard Shortcuts, Study Hacks..."></textarea>
    </div>

    <button id="generateBtn" onclick="generateCheats()">Get Cheats ✨</button>

    <div id="outputBox" class="output-box">
        <div class="output-title">💡 Generated Cheats:</div>
        <div id="cheatContent" class="cheat-content"></div>
    </div>

    <div class="footer-credit">
        Designed & Developed with ❤️ by <strong>[Aapka Naam]</strong>
    </div>
</div>

<script>
    // 🌍 Welcome alert jo doston ko hairan karega
    window.onload = function() {
        alert("🚀 Welcome to [Aapka Naam]'s Official AI Cheats Bot!");
    };

    async function generateCheats() {
        const topic = document.getElementById('topicInput').value.trim();
        const outputBox = document.getElementById('outputBox');
        const cheatContent = document.getElementById('cheatContent');
        const btn = document.getElementById('generateBtn');

        if (!topic) { alert("Kuch to topic likho dost!"); return; }

        btn.disabled = true;
        btn.innerText = "🚀 [Aapka Naam]'s AI soch raha hai...";
        outputBox.style.display = "block";
        cheatContent.innerText = "Loading Cheats...";

        try {
            const response = await fetch('/api/generate', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ topic: topic })
            });

            const data = await response.json();

            if (data.result) {
                cheatContent.innerText = data.result;
            } else {
                cheatContent.innerText = "Oops! " + (data.error || "Koi jawab nahi mila.");
            }

        } catch (error) {
            console.error(error);
            cheatContent.innerText = "Error: Server se connect nahi ho paya.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Get Cheats ✨";
        }
    }
</script>

</body>
</html>
