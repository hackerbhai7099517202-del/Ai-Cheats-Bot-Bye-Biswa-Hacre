<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biswa AI - Powerful Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .chat-container { max-width: 650px; margin: 40px auto; padding: 20px; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="flex items-center justify-between border-b border-gray-700 pb-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-full text-white text-xl">🤖</div>
                <div>
                    <h1 class="text-xl font-bold text-white">Biswa AI</h1>
                    <p class="text-xs text-gray-400">Powered by Gemini Pro</p>
                </div>
            </div>
            <span class="text-xs bg-gray-800 text-blue-400 px-3 py-1 rounded-full font-semibold border border-blue-500/30">Created by Biswa</span>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl">
            <label class="block text-sm font-medium text-gray-300 mb-2">Aapko kis cheez ka solution ya code chahiye?</label>
            <textarea id="userInput" rows="4" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 placeholder-gray-500 resize-none" placeholder="Apna sawaal likhein ya code likhne ko kahein..."></textarea>
            
            <button id="sendBtn" onclick="askAI()" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-lg flex justify-center items-center gap-2">
                <span>Ask Biswa AI ✨</span>
            </button>
        </div>

        <div class="mt-6 bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-xl">
            <h3 class="text-sm font-semibold text-gray-400 mb-2">Generated Response:</h3>
            <div id="outputBox" class="bg-gray-950 border border-gray-700 rounded-lg p-4 min-h-[100px] whitespace-pre-wrap text-gray-200">
                Aapka jawab yahan dikhega...
            </div>
        </div>
    </div>

    <script>
        async function askAI() {
            const userInput = document.getElementById('userInput').value.trim();
            const outputBox = document.getElementById('outputBox');
            const sendBtn = document.getElementById('sendBtn');

            if (!userInput) {
                alert("Pehle kuch sawaal toh likho dost!");
                return;
            }

            // Loading state
            outputBox.innerText = "Biswa AI soch raha hai... 🤔 Please wait...";
            sendBtn.disabled = true;
            sendBtn.innerText = "Processing...";

            try {
                // IMPORTANT: Vercel serverless function ka sahi path
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ topic: userInput })
                });

                const data = await response.json();

                if (response.ok) {
                    outputBox.innerText = data.result;
                } else {
                    outputBox.innerText = "Oops! " + (data.error || "Upar se error mila.");
                }
            } catch (error) {
                console.error("Connection Error:", error);
                outputBox.innerText = "Error: Backend server se connect nahi ho pa raha hai.";
            } finally {
                // Reset button state
                sendBtn.disabled = false;
                sendBtn.innerText = "Ask Biswa AI ✨";
            }
        }
    </script>
</body>
</html>
