<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biswa AI - Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: #111318; color: #e3e3e3; display: flex; justify-content: center; height: 100vh; }
        
        /* Main Chat Container */
        .chat-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; height: 100vh; background-color: #131314; position: relative; }
        
        /* Header / Top Bar */
        .chat-header { padding: 15px 20px; border-bottom: 1px solid #282a2c; display: flex; justify-content: space-between; align-items: center; background-color: #1e1f20; }
        .bot-info { display: flex; align-items: center; gap: 10px; }
        .bot-avatar { width: 35px; height: 35px; background: linear-gradient(45deg, #1a73e8, #bf360c); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .bot-name { font-weight: 600; font-size: 16px; color: #fff; }
        .creator-badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 1px solid rgba(56, 189, 248, 0.3); }
        
        /* Chat History Screen */
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* Welcome Message Screen */
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; color: #8e918f; padding: 20px; }
        .welcome-screen h1 { color: #fff; font-size: 28px; margin-bottom: 10px; font-weight: 500; }
        .welcome-screen span { background: linear-gradient(45deg, #4285f4, #9b51e0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: bold; }

        /* Chat Bubbles (ChatGPT Style) */
        .message { display: flex; gap: 15px; max-width: 85%; animation: fadeIn 0.3s ease-in-out; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }
        
        .msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .user .msg-avatar { background: #4285f4; color: white; }
        .bot .msg-avatar { background: #1e1f20; border: 1px solid #444746; color: #38bdf8; }
        
        .msg-text { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .user .msg-text { background-color: #2b2a33; color: #f4f4f4; border-top-right-radius: 4px; }
        .bot .msg-text { background-color: transparent; color: #e3e3e3; }
        
        /* Loading/Thinking Bubble */
        .loading-bubble { display: flex; gap: 5px; padding: 10px; }
        .dot { width: 8px; height: 8px; background: #8e918f; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* Input Bottom Bar (Gemini Style) */
        .input-container { padding: 15px 20px; background-color: #131314; }
        .input-area { max-width: 100%; display: flex; align-items: center; background-color: #1e1f20; border-radius: 28px; padding: 6px 14px; border: 1px solid #444746; transition: border 0.2s; }
        .input-area:focus-within { border-color: #8e918f; background-color: #222324; }
        
        input { flex: 1; background: none; border: none; outline: none; color: #fff; padding: 12px; font-size: 16px; }
        input::placeholder { color: #8e918f; }
        
        button { background: none; border: none; color: #a8c7fa; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: background 0.2s; }
        button:hover { background: #2d2f31; color: #fff; }
        button:disabled { color: #444746; cursor: not-allowed; }

        /* Footer Branding */
        .footer-brand { text-align: center; font-size: 11px; color: #444746; padding-top: 8px; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="bot-info">
            <div class="bot-avatar">🤖</div>
            <div class="bot-name">Biswa AI</div>
        </div>
        <div class="creator-badge">Created by Biswa</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="welcome-screen" id="welcomeScreen">
            <h1>Hello, I am <span>Biswa AI</span></h1>
            <p>How can I help you today? Ask me anything, solve coding, math or get shortcuts.</p>
        </div>
    </div>

    <div class="input-container">
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Biswa AI..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button id="sendBtn" onclick="sendMessage()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <div class="footer-brand">Biswa AI can make mistakes. Verify important info.</div>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const text = inputField.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('chatBox');
        const welcomeScreen = document.getElementById('welcomeScreen');

        // Hide welcome screen on first message
        if (welcomeScreen) welcomeScreen.remove();

        // 1. Append User Message
        appendMessage('user', text);
        inputField.value = ''; // clear input

        // 2. Append Loading/Thinking Indicator
        const loadingId = appendLoading();
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Send request to our backend api
            const response = await fetch('/api/generate', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ topic: text })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove(); // remove loading

            if (data.result) {
                appendMessage('bot', data.result);
            } else {
                appendMessage('bot', "Oops! Setup issue. Make sure GEMINI_API_KEY is correctly set in Vercel settings.");
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage('bot', "Error: Could not connect to the server.");
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        
        const avatarStr = sender === 'user' ? 'U' : 'AI';
        
        msgDiv.innerHTML = `
            <div class="msg-avatar">${avatarStr}</div>
            <div class="msg-text">${text}</div>
        `;
        chatBox.appendChild(msgDiv);
    }

    function appendLoading() {
        const chatBox = document.getElementById('chatBox');
        const loadingDiv = document.createElement('div');
        const id = 'loading-' + Date.now();
        loadingDiv.className = 'message bot';
        loadingDiv.id = id;
        loadingDiv.innerHTML = `
            <div class="msg-avatar">AI</div>
            <div class="msg-text">
                <div class="loading-bubble">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        `;
        chatBox.appendChild(loadingDiv);
        return id;
    }
</script>

</body>
</html>
